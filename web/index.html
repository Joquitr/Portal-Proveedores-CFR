<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFR · Portal de proveedores</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#233449;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:0;background:#12675d;color:white;border-radius:7px;padding:11px 16px}button.secondary{background:#e8eef3;color:#233449}a{color:#12675d;text-decoration:none}aside{position:fixed;width:232px;inset:0 auto 0 0;background:#102e3b;color:#c8d7de;padding:30px 20px}aside h1{color:white;font-size:30px;margin:0}aside small{color:#8da7b2}nav{margin-top:44px}nav a{display:block;padding:14px;color:#c8d7de;border-radius:7px;margin:5px 0}nav a.active{background:#204956;color:white}main{margin-left:232px;padding:34px 44px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dde4eb;padding-bottom:22px;margin-bottom:32px}h2{font-size:29px;margin:8px 0}h3{font-size:17px}p{line-height:1.6;color:#647487}.card{background:white;border:1px solid #e0e7ed;border-radius:12px;padding:24px;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stats .card{margin:8px 0}.stats strong{display:block;font-size:29px;margin:14px 0}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:15px 10px;border-bottom:1px solid #edf0f4;font-size:14px}th{color:#6d7d8a;font-size:12px;text-transform:uppercase}.badge{display:inline-block;background:#e6f3ef;color:#176b5b;border-radius:20px;padding:5px 10px;font-size:12px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,select,textarea{padding:11px;border:1px solid #ccd8df;border-radius:6px;background:white;max-width:100%;width:100%}label{display:block;margin:15px 0;font-size:13px}label input,label select,label textarea{display:block;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.notice{background:#fff3d9;color:#82601f;padding:12px 18px;border-radius:7px;font-size:13px}.empty{padding:35px;color:#788996;text-align:center}#error{color:#a72c2c;padding:10px 0}#login{max-width:440px;margin:10vh auto;padding:32px}.bars{display:flex;gap:12px;align-items:flex-end;height:150px;padding-top:25px}.bar{background:#40998a;min-height:4px;flex:1;position:relative}.bar span{font-size:11px;position:absolute;bottom:-24px;width:100%;text-align:center}footer{color:#82929d;font-size:12px;margin-top:36px}@media(max-width:800px){aside{position:static;width:auto;padding:20px}nav{margin:15px 0 0;display:flex;flex-wrap:wrap}nav a{padding:8px}main{margin:0;padding:20px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.card{overflow:auto}header{gap:10px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .2s ease}@keyframes appear{from{opacity:0;transform:translateY(4px)}}}
</style><body><div id="app"></div><script>
let state, filter='', query='';const app=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c='PEN')=>new Intl.NumberFormat('es-PE',{style:'currency',currency:c}).format(n);const badge=s=>`<span class="badge">${esc(s)}</span>`;
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function refresh(){try{state=await api('state');render()}catch(e){login(e.message==='Inicie sesión'?'':e.message)}}
function login(error=''){app.innerHTML=`<div id="login" class="card"><small>CFR · PORTAL DE PROVEEDORES</small><h2>Bienvenido</h2><p>Accede para gestionar tus documentos y consultar tus órdenes.</p><form id="signin"><label>Correo electrónico<input name="email" type="email" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><div id="error">${esc(error)}</div><button>Ingresar al portal</button></form><p>Entorno de demostración · SAP simulado</p></div>`;document.querySelector('#signin').onsubmit=async e=>{e.preventDefault();try{await api('login',Object.fromEntries(new FormData(e.target)));await refresh()}catch(x){document.querySelector('#error').textContent=x.message}}}
function table(head,rows){return rows.length?`<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No hay registros disponibles.</div>'}
function docs(rows){return table(['Documento','Orden','Emisión','Importe','Estado'],rows.map(d=>[`<a href="#/documentos/${d.id}">${esc(d.type)} ${esc(d.series)}-${esc(d.number)}</a>`,esc(d.order),esc(d.date),money(d.total,d.currency),badge(d.status)]))}
function field(name,title,type='text',value=''){return `<label>${title}<input name="${name}" type="${type}" value="${esc(value)}" required ${type==='number'?'min="0" step="0.01"':''}></label>`}
function render(){let route=location.hash.slice(2)||'panel';let [page,id]=route.split('/');const u=state.user;const admin=u.role==='Administrador',audit=['Administrador','Auditor'].includes(u.role);let links=[['panel','Panel principal'],['ordenes','Órdenes de compra'],['documentos','Documentos'],['pagos','Pagos'],['comunicados','Comunicados']];if(admin)links.push(['usuarios','Usuarios'],['integracion','Integración SAP']);if(u.role!=='Proveedor')links.push(['cambio','Tipos de cambio']);if(audit)links.push(['auditoria','Auditoría']);app.innerHTML=`<aside><h1>CFR<span style="color:#5fc5af">.</span></h1><small>PORTAL DE PROVEEDORES</small><nav>${links.map(([r,t])=>`<a class="${r===page?'active':''}" href="#/${r}">${t}</a>`).join('')}</nav></aside><main><header><div><small>ESPACIO DE TRABAJO</small><h3>${esc(u.name)}</h3></div><div>${badge(u.role)} <button class="secondary" id="logout">Salir</button></div></header><div class="notice">Prototipo funcional · Datos de demostración · Sin conexión real con SAP ni transferencias bancarias</div><div id="error" role="alert"></div><section id="view"></section><footer>CFR · Portal de proveedores · Gestión y trazabilidad documental</footer></main>`;document.querySelector('#logout').onclick=async()=>{await api('logout',{});state=null;login()};const view=document.querySelector('#view');
if(page==='panel'){const ds=state.documents;view.innerHTML=`<h2>Todo en un solo lugar</h2><p>Consulta tus órdenes y mantén el control de tus documentos.</p><div class="stats">${[['Órdenes disponibles',state.orders.length],['Pendientes de revisión',ds.filter(d=>d.status==='Pendiente de revisión').length],['Documentos observados',ds.filter(d=>d.status==='Observado').length],['Documentos pagados',ds.filter(d=>d.status==='Pagado').length]].map(([t,n])=>`<div class="card"><small>${t}</small><strong>${n}</strong></div>`).join('')}</div><div class="card"><h3>Evolución de importes documentados</h3>${ds.length?['PEN','USD'].map(c=>{let m={};ds.filter(d=>d.currency===c).forEach(d=>m[d.date.slice(0,7)]=(m[d.date.slice(0,7)]||0)+d.total);let max=Math.max(...Object.values(m),1);return `<h4>${c}</h4><div class="bars">${Object.entries(m).sort().map(([k,n])=>`<div class="bar" style="height:${Math.max(4,n/max*100)}%" title="${esc(money(n,c))}"><span>${k}</span></div>`).join('')}</div><br>`}).join(''):'<p>La evolución aparecerá cuando registres documentos.</p>'}</div><div class="card"><h3>Documentos recientes</h3>${docs(ds.slice(-5).reverse())}</div>`}
else if(page==='ordenes'&&id){const o=state.orders.find(o=>o.id===id);view.innerHTML=o?`<p><a href="#/ordenes">← Volver a órdenes</a></p><h2>${esc(o.id)}</h2><div class="card"><p>Proveedor: ${esc(o.supplier)} · ${esc(o.date)} · ${esc(o.warehouse)}</p><h3>${money(o.total,o.currency)} ${badge(o.status)}</h3>${table(['Artículo','Cantidad','Precio'],o.items.map(i=>[esc(i.name),i.quantity,money(i.price,o.currency)]))}${u.role!=='Auditor'?`<p><a href="#/nuevo/${o.id}">Registrar documento →</a></p>`:''}</div><div class="card"><h3>Documentos relacionados</h3>${docs(state.documents.filter(d=>d.order===o.id))}</div>`:'<p>Orden no disponible</p>'}
else if(page==='ordenes'||page==='documentos'){let orders=page==='ordenes';let rows=(orders?state.orders:state.documents).filter(x=>(!filter||x.status===filter)&&JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));view.innerHTML=`<h2>${orders?'Órdenes de compra':'Documentos'}</h2><p>${orders?'Revisa el detalle de tus órdenes y registra documentos.':'Consulta estados, observaciones e historial.'}</p><div class="toolbar"><input id="search" aria-label="Buscar" placeholder="Buscar…" value="${esc(query)}" style="width:280px"><select id="status" aria-label="Estado" style="width:240px"><option value="">Todos los estados</option>${[...new Set((orders?state.orders:state.documents).map(x=>x.status))].map(s=>`<option ${filter===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="card">${orders?table(['Orden','Proveedor','Fecha','Importe','Estado'],rows.map(o=>[`<a href="#/ordenes/${o.id}">${esc(o.id)}</a>`,esc(o.supplier),esc(o.date),money(o.total,o.currency),badge(o.status)])):docs(rows)}</div>`;document.querySelector('#search').onchange=e=>{query=e.target.value;render()};document.querySelector('#status').onchange=e=>{filter=e.target.value;render()};if(!orders&&id){const d=state.documents.find(d=>d.id===id);if(d){let targets=state.flow[d.status]||[];if(u.role==='Auditor')targets=[];if(u.role==='Proveedor')targets=d.status==='Observado'?['Pendiente de revisión']:[];view.innerHTML=`<p><a href="#/documentos">← Volver a documentos</a></p><h2>${esc(d.type)} ${esc(d.series)}-${esc(d.number)}</h2><div class="card">${badge(d.status)}<h3>${money(d.total,d.currency)}</h3><p>Orden: ${esc(d.order)} · Fecha: ${esc(d.date)} · Proveedor: ${esc(d.supplier)}</p><p>Subtotal: ${money(d.subtotal,d.currency)} · Impuestos: ${money(d.tax,d.currency)}</p><p>${esc(d.notes)}</p>${targets.length?`<form id="transition"><label>Acción<select name="status">${targets.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label>Comentario o referencia<textarea name="comment"></textarea></label><button>Aplicar acción</button></form>`:''}</div><div class="card"><h3>Historial</h3>${table(['Fecha','Responsable','Estado','Comentario'],d.history.map(h=>[esc(h.date),esc(h.user),badge(h.status),esc(h.comment)]))}</div>`;bind('transition','transition',()=>({id:d.id}))}else view.innerHTML='<p>Documento no disponible</p>'}}
else if(page==='nuevo'){const o=state.orders.find(o=>o.id===id);view.innerHTML=o?`<p><a href="#/ordenes/${o.id}">← Volver a la orden</a></p><h2>Registrar documento</h2><p>Orden ${esc(o.id)} · ${money(o.total,o.currency)}</p><form class="card" id="document"><div class="grid"><label>Tipo<select name="type"><option>Factura</option><option>Boleta</option><option>Nota de crédito</option><option>Nota de débito</option></select></label>${field('series','Serie')}${field('number','Número')}${field('date','Fecha de emisión','date')}${field('currency','Moneda','text',o.currency)}${field('subtotal','Subtotal','number')}${field('tax','Impuestos','number')}</div><label>Observaciones<textarea name="notes"></textarea></label><p>Los adjuntos no están implementados en este prototipo.</p><button>Enviar a revisión</button></form>`:'<p>Orden no disponible</p>';bind('document','documents',()=>({order:id}),()=>{location.hash='/documentos'})}
else if(page==='pagos')view.innerHTML=`<h2>Pagos</h2><p>Seguimiento de programación y confirmaciones registradas por Finanzas.</p><div class="card"><h3>Documentos programados</h3>${docs(state.documents.filter(d=>d.status==='Programado'))}</div><div class="card"><h3>Pagos registrados</h3>${table(['Documento','Fecha','Importe','Referencia'],state.payments.map(p=>[esc(p.document),esc(p.date),money(p.total,p.currency),esc(p.reference)]))}</div>`;
else if(page==='comunicados')view.innerHTML=`<h2>Comunicados</h2>${state.announcements.map(a=>`<article class="card"><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></article>`).join('')}`;
else if(page==='usuarios'&&admin){view.innerHTML=`<h2>Usuarios</h2><div class="card">${table(['Nombre','Correo','Rol','Proveedor'],state.users.map(x=>[esc(x.name),esc(x.email),esc(x.role),esc(x.supplier)]))}</div><form id="user" class="card"><h3>Crear usuario</h3><div class="grid">${field('name','Nombre')}${field('email','Correo','email')}${field('password','Contraseña inicial (mínimo 10 caracteres)','password')}<label>Rol<select name="role">${['Proveedor','Finanzas','Administrador','Auditor'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Proveedor (para cuentas externas)<select name="supplier">${state.suppliers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div><button>Crear usuario</button></form>`;bind('user','users')}
else if(page==='integracion'&&admin){view.innerHTML=`<h2>Integración SAP Business One</h2><div class="card"><h3>Modo simulado</h3><p>Las órdenes de demostración se preparan al inicializar el portal. Esta acción registra una comprobación simulada; no lee ni envía información a SAP.</p><button id="sync">Ejecutar simulación</button></div><div class="card">${table(['Fecha','Usuario','Resultado'],state.sync.map(x=>[esc(x.date),esc(x.user),esc(x.result)]))}</div>`;document.querySelector('#sync').onclick=async()=>{try{await api('sync',{});refresh()}catch(e){error(e)}}}
else if(page==='auditoria'&&audit)view.innerHTML=`<h2>Auditoría</h2><div class="card">${table(['Fecha','Usuario','Acción','Entidad','Detalle'],state.audit.map(x=>[esc(x.date),esc(x.user),esc(x.action),esc(x.entity),esc(x.detail)]))}</div>`;
else if(page==='cambio'&&u.role!=='Proveedor')view.innerHTML=`<h2>Tipos de cambio</h2><div class="card">${table(['Fecha','Moneda','Valor','Fuente'],state.rates.map(x=>[esc(x.date),esc(x.currency),esc(x.value),esc(x.source)]))}</div>`;
else view.innerHTML='<h2>Página no disponible</h2><a href="#/panel">Volver al panel</a>';
}
function error(e){document.querySelector('#error').textContent=e.message;window.scrollTo(0,0)}function bind(id,path,extra=()=>({}),done=()=>{}){const f=document.getElementById(id);if(f)f.onsubmit=async e=>{e.preventDefault();const button=f.querySelector('button');button.disabled=true;try{await api(path,{...Object.fromEntries(new FormData(f)),...extra()});done();await refresh()}catch(x){error(x);button.disabled=false}}}window.onhashchange=()=>{filter='';query='';if(state)render()};refresh();
</script></body></html>
